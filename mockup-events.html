<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events Tab Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --s1: #1e293b; --s2: #263145;
    --teal: #2dd4bf; --bd: rgba(255,255,255,0.1);
    --text: #f1f5f9; --soft: #94a3b8; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Open Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }

  /* Modal shell */
  .modal { background: var(--s1); border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1rem; color: #fff; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; line-height: 1; }

  /* Tab buttons */
  .act-type-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: var(--soft); border-radius: 20px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; font-family: 'Montserrat', sans-serif; cursor: pointer; transition: all 0.15s; }
  .act-type-btn:hover { border-color: var(--teal); color: var(--teal); }
  .act-type-btn.active { background: var(--teal); border-color: var(--teal); color: #0f172a; }
  .tab-row { display: flex; flex-wrap: wrap; gap: 8px; }

  /* Date picker row */
  .date-row { display: flex; gap: 10px; align-items: flex-end; }
  .date-field { display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .date-field label { font-size: 0.72rem; color: var(--muted); font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .date-field input { background: var(--s2); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 9px 12px; color: var(--text); font-family: 'Open Sans', sans-serif; font-size: 0.85rem; outline: none; width: 100%; }
  .date-field input:focus { border-color: var(--teal); }
  .find-btn { background: var(--teal); color: #0f172a; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 0.82rem; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }

  /* Results */
  .results-meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 2px; }
  .event-card { background: var(--s2); border-radius: 10px; padding: 14px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
  .event-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .event-name { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.9rem; color: #fff; flex: 1; line-height: 1.35; }
  .event-cat { font-size: 0.7rem; font-weight: 700; font-family: 'Montserrat', sans-serif; border-radius: 12px; padding: 3px 10px; white-space: nowrap; flex-shrink: 0; }
  .cat-music   { background: rgba(139,92,246,0.2); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
  .cat-sports  { background: rgba(251,146,60,0.2); color: #fb923c; border: 1px solid rgba(251,146,60,0.3); }
  .cat-arts    { background: rgba(45,212,191,0.2); color: var(--teal); border: 1px solid rgba(45,212,191,0.3); }
  .cat-family  { background: rgba(251,191,36,0.2); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
  .event-meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .event-date { font-size: 0.8rem; color: var(--teal); font-weight: 600; }
  .event-venue { font-size: 0.78rem; color: var(--soft); }
  .event-link { font-size: 0.75rem; color: var(--muted); text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 600; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 3px 10px; transition: all 0.15s; margin-top: 2px; align-self: flex-start; }
  .event-link:hover { border-color: var(--teal); color: var(--teal); }

  .finished-row { text-align: right; margin-top: 4px; }
  .finished-btn { background: var(--teal); color: #0f172a; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.85rem; border: none; border-radius: 8px; padding: 10px 28px; cursor: pointer; }

  /* State toggle buttons (for demo only) */
  .demo-controls { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; }
  .demo-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: var(--soft); border-radius: 8px; padding: 6px 12px; font-size: 0.75rem; font-family: 'Montserrat', sans-serif; font-weight: 600; cursor: pointer; }
  .demo-btn:hover { color: var(--teal); border-color: var(--teal); }
</style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="demo-controls">
  <button class="demo-btn" onclick="showState('empty')">① Empty</button>
  <button class="demo-btn" onclick="showState('loading')">② Loading</button>
  <button class="demo-btn" onclick="showState('results')">③ Results</button>
  <button class="demo-btn" onclick="showState('none')">④ No Events</button>
</div>

<div class="modal">

  <!-- Header -->
  <div class="modal-header">
    <div class="modal-title">⚡ Activities · Bayfield, WI</div>
    <button class="modal-close">×</button>
  </div>

  <!-- Tab row — Events added as new tab -->
  <div class="tab-row">
    <button class="act-type-btn" onclick="selectTab(this)">✦ Experiences</button>
    <button class="act-type-btn" onclick="selectTab(this)">🥾 Hiking</button>
    <button class="act-type-btn" onclick="selectTab(this)">🤿 Diving</button>
    <button class="act-type-btn" onclick="selectTab(this)">🎣 Fishing</button>
    <button class="act-type-btn active" onclick="selectTab(this)">🎟 Events</button>
  </div>

  <!-- Date picker (Events tab only) -->
  <div id="date-picker" style="display:flex;flex-direction:column;gap:10px;">
    <div class="date-row">
      <div class="date-field">
        <label>From</label>
        <input type="date" value="2026-04-11" />
      </div>
      <div class="date-field">
        <label>To</label>
        <input type="date" value="2026-04-15" />
      </div>
      <div class="date-field" style="max-width:110px;">
        <label>Radius</label>
        <select style="background:var(--s2);border:1.5px solid rgba(255,255,255,0.1);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Open Sans',sans-serif;font-size:0.85rem;outline:none;width:100%;cursor:pointer;">
          <option>25 mi</option>
          <option selected>50 mi</option>
          <option>100 mi</option>
          <option>150 mi</option>
        </select>
      </div>
    </div>
    <button class="find-btn" style="align-self:flex-end;" onclick="showState('results')">Find Events</button>
  </div>

  <!-- Body: swaps between states -->
  <div id="modal-body"></div>

  <!-- Finished button -->
  <div id="finished-row" class="finished-row" style="display:none;">
    <button class="finished-btn">Finished</button>
  </div>

</div>

<script>
const states = {
  empty: '',
  loading: '<p style="color:var(--muted);font-style:italic;">Finding events near Bayfield, WI…</p>',
  none: '<p style="color:var(--muted);">No major events found near Bayfield between Apr 11–15. Try widening the date range.</p>',
  results: `
    <div class="results-meta">8 events near Bayfield, WI · Apr 11–15</div>

    <div class="event-card">
      <div class="event-top">
        <div class="event-name">Lake Superior Big Top Chautauqua — Spring Concert Series</div>
        <span class="event-cat cat-music">Music</span>
      </div>
      <div class="event-meta">
        <span class="event-date">Fri Apr 11 · 7:30 PM</span>
        <span class="event-venue">Big Top Chautauqua, Bayfield</span>
      </div>
      <a href="#" class="event-link">Tickets →</a>
    </div>

    <div class="event-card">
      <div class="event-top">
        <div class="event-name">Milwaukee Bucks vs Chicago Bulls</div>
        <span class="event-cat cat-sports">Sports</span>
      </div>
      <div class="event-meta">
        <span class="event-date">Sat Apr 12 · 6:00 PM</span>
        <span class="event-venue">Fiserv Forum, Milwaukee</span>
      </div>
      <a href="#" class="event-link">Tickets →</a>
    </div>

    <div class="event-card">
      <div class="event-top">
        <div class="event-name">Chris Stapleton — All-American Road Show</div>
        <span class="event-cat cat-music">Music</span>
      </div>
      <div class="event-meta">
        <span class="event-date">Sat Apr 12 · 8:00 PM</span>
        <span class="event-venue">Baywaves Amphitheater, Ashland</span>
      </div>
      <a href="#" class="event-link">Tickets →</a>
    </div>

    <div class="event-card">
      <div class="event-top">
        <div class="event-name">Cirque du Soleil — ECHO</div>
        <span class="event-cat cat-arts">Arts &amp; Theatre</span>
      </div>
      <div class="event-meta">
        <span class="event-date">Sun Apr 13 · 2:00 PM</span>
        <span class="event-venue">Twin Ports Arena, Duluth</span>
      </div>
      <a href="#" class="event-link">Tickets →</a>
    </div>

    <div class="event-card">
      <div class="event-top">
        <div class="event-name">Apostle Islands Spring Family Festival</div>
        <span class="event-cat cat-family">Family</span>
      </div>
      <div class="event-meta">
        <span class="event-date">Mon Apr 14 · 10:00 AM</span>
        <span class="event-venue">Bayfield Memorial Park</span>
      </div>
      <a href="#" class="event-link">Tickets →</a>
    </div>
  `
};

function showState(s) {
  document.getElementById('modal-body').innerHTML = states[s];
  document.getElementById('finished-row').style.display = (s === 'results' || s === 'none') ? 'block' : 'none';
}

function selectTab(btn) {
  document.querySelectorAll('.act-type-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const isEvents = btn.textContent.includes('Events');
  document.getElementById('date-picker').style.display = isEvents ? 'flex' : 'none';
  if (!isEvents) { document.getElementById('modal-body').innerHTML = ''; document.getElementById('finished-row').style.display = 'none'; }
}

// Start on empty state
showState('empty');
</script>
</body>
</html>
