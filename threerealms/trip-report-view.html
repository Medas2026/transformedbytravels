<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Trip Report — Three Realms Travel</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:   #2dd4bf;
      --teal2:  #14b8a6;
      --dark:   #0a1628;
      --navy:   #0f172a;
      --s2:     #1e293b;
      --text:   #f1f5f9;
      --soft:   #cbd5e1;
      --muted:  #64748b;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--navy); color: var(--text); font-family: 'Lora', Georgia, serif; overflow-x: hidden; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 48px;
      background: linear-gradient(to bottom, rgba(10,22,40,0.95), transparent);
      backdrop-filter: blur(4px);
    }
    .nav-brand { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--text); letter-spacing: 0.04em; text-decoration: none; }
    .nav-brand span { color: var(--teal); }
    .nav-links { display: flex; gap: 32px; align-items: center; }
    .nav-links a { color: var(--soft); text-decoration: none; font-family: 'Montserrat', sans-serif; font-size: 0.82rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; transition: color 0.2s; }
    .nav-links a:hover { color: var(--teal); }
    .nav-cta { background: var(--teal); color: #0a1628 !important; padding: 9px 22px; border-radius: 6px; font-weight: 800 !important; }

    /* ── HERO ── */
    .hero {
      min-height: 70vh;
      position: relative;
      display: flex; align-items: flex-end;
      padding: 0 48px 80px;
      overflow: hidden;
    }
    .hero-bg { position: absolute; inset: 0; background: var(--dark); }
    .hero-bg-img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.4; }
    .hero-scrim {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,22,40,0.98) 0%, rgba(10,22,40,0.55) 55%, rgba(10,22,40,0.25) 100%);
    }
    .hero-content { position: relative; z-index: 2; max-width: 900px; }
    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.78rem;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft);
      text-decoration: none; margin-bottom: 28px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--teal); }
    .destination-tag {
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.8rem;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal);
      margin-bottom: 18px;
    }
    .hero-title {
      font-family: 'Montserrat', sans-serif; font-weight: 900;
      font-size: 3.6rem; line-height: 1.05; letter-spacing: -0.02em;
      margin-bottom: 22px;
    }
    .trip-summary {
      font-size: 1.15rem; line-height: 1.75; color: var(--soft);
      max-width: 780px;
    }
    .trip-summary p { margin-bottom: 14px; }
    .trip-summary p:last-child { margin-bottom: 0; }
    /* Hero CTA — deliberately an outline, not a filled button. The reader has not been
       sold anything yet; this is for the person who already knows they want the trip.
       The filled primary CTA stays at the end, where they have read the case for it. */
    .hero-cta {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 26px; padding: 12px 24px;
      border: 1.5px solid rgba(45,212,191,0.55); border-radius: 999px;
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.82rem;
      letter-spacing: 0.05em; color: var(--teal); text-decoration: none;
      background: rgba(10,22,40,0.35); backdrop-filter: blur(3px);
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .hero-cta:hover { background: rgba(45,212,191,0.14); border-color: var(--teal); transform: translateY(-1px); }
    .hero-cta:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

    /* ── SECTIONS ── */
    .sections-wrap { padding: 80px 48px; max-width: 1100px; margin: 0 auto; }
    .section {
      margin-bottom: 96px;
      /* The nav is fixed and ~126px tall, so a map pin jumping to a section would
         otherwise land its heading underneath the navbar. */
      scroll-margin-top: 150px;
    }
    .section:last-child { margin-bottom: 0; }
    .section-subtitle {
      font-family: 'Montserrat', sans-serif; font-weight: 800;
      font-size: 1.9rem; line-height: 1.2; letter-spacing: -0.01em;
      margin-bottom: 22px; color: var(--text);
    }
    .section-body {
      font-size: 1.05rem; line-height: 1.85; color: var(--soft);
      margin-bottom: 32px;
    }
    .section-body p  { margin-bottom: 16px; }
    .section-body p:last-child { margin-bottom: 0; }
    .section-body strong { color: var(--text); font-weight: 700; }
    .section-body em { font-style: italic; color: var(--text); }
    .section-body a { color: var(--teal); }

    /* Photo layouts — stacked single column, photos shown at their native
       aspect ratio (no cropping) so landscape shots read full-width and large. */
    .photo-grid { display: grid; gap: 22px; grid-template-columns: 1fr; max-width: 860px; margin: 0 auto; }
    .ph { margin: 0; display: grid; gap: 8px; }
    .ph img, .ph video {
      width: 100%; height: auto; display: block;
      border-radius: 8px;
      background: var(--s2);
    }
    .ph figcaption {
      font-family: 'Lora', Georgia, serif; font-style: italic;
      font-size: 0.88rem; line-height: 1.55; color: var(--muted);
    }
    /* Portrait shots (tagged on load) are held to the height a 3:2 landscape occupies
       at full column width, so they sit level with their neighbors — narrower and
       centred instead of towering over the column. */
    .ph.portrait { justify-items: center; }
    .ph.portrait img, .ph.portrait video {
      width: auto; height: auto;
      max-width: 100%; max-height: 573px;
    }
    /* Hosted players (YouTube / Vimeo) — sized by ratio, since an iframe reports no
       intrinsic dimensions to measure. */
    .ph.embed iframe {
      width: 100%; aspect-ratio: 16 / 9;
      display: block; border: 0; border-radius: 8px;
      background: #000;
    }
    .ph.embed.vertical { justify-items: center; }
    .ph.embed.vertical iframe {
      width: auto; height: 573px; aspect-ratio: 9 / 16;
      max-width: 100%;
    }
    .ph.portrait figcaption { text-align: center; max-width: 573px; }

    /* ── TRIP MAP ── */
    .map-wrap { padding: 0 48px; max-width: 1100px; margin: -20px auto 0; }
    .map-card {
      background: var(--s2); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; overflow: hidden;
    }
    .map-head {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      padding: 18px 24px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .map-title {
      font-family: 'Montserrat', sans-serif; font-weight: 800;
      font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal);
    }
    .map-hint { font-size: 0.85rem; color: var(--muted); }
    #trip-map { height: 420px; width: 100%; background: var(--dark); }
    .leaflet-container { background: var(--dark); font-family: 'Montserrat', sans-serif; }
    .leaflet-container a { color: var(--teal); }
    .leaflet-tooltip.stop-tip {
      background: var(--dark); border: 1px solid rgba(45,212,191,0.4); color: var(--text);
      font-family: 'Montserrat', sans-serif; font-size: 0.78rem; font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5); border-radius: 6px;
    }
    .leaflet-tooltip.stop-tip::before { border-top-color: rgba(45,212,191,0.4); }
    .map-note { font-size: 0.8rem; color: var(--muted); padding: 11px 24px 15px; }
    /* Lettered pins — the letter ties each stop to its heading below. Pins are
       navigation, so they must read as clickable; Leaflet puts a grab cursor on the
       container, so these need to be specific enough to win. */
    #trip-map .trip-pin-wrap { cursor: pointer !important; background: none; border: 0; }
    #trip-map .trip-pin {
      display: flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--teal); color: #0a1628;
      border: 2.5px solid #0a1628;
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.86rem;
      line-height: 1; letter-spacing: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.55);
      transition: transform 0.15s, background 0.15s;
    }
    #trip-map .trip-pin-wrap:hover .trip-pin { background: #5eead4; transform: scale(1.15); }
    #trip-map .trip-pin-wrap:focus-visible .trip-pin { outline: 2px solid #fff; outline-offset: 2px; }

    /* Matching badge on the heading, so map and text read as one thing. */
    .seq-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(45,212,191,0.16); color: var(--teal);
      border: 1px solid rgba(45,212,191,0.45);
      font-size: 0.82rem; font-weight: 900;
      margin-right: 13px; vertical-align: 3px; flex: none;
    }
    /* Brief flash on the section a pin jumps to, so the jump is legible. */
    @keyframes section-land {
      0%   { background: rgba(45,212,191,0.14); }
      100% { background: transparent; }
    }
    .section.landed { animation: section-land 1.6s ease-out; border-radius: 10px; }
    /* ── MID-REPORT PROMPT ── */
    .mid-cta {
      display: flex; align-items: center; gap: 20px;
      margin: 0 0 96px;
    }
    .mid-rule { flex: 1; height: 1px; background: rgba(45,212,191,0.22); }
    .mid-link {
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.82rem;
      letter-spacing: 0.05em; color: var(--teal); text-decoration: none;
      white-space: nowrap; padding: 9px 20px; border-radius: 999px;
      border: 1px solid rgba(45,212,191,0.35);
      transition: background 0.2s, border-color 0.2s;
    }
    .mid-link:hover { background: rgba(45,212,191,0.1); border-color: var(--teal); }
    .mid-link:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    @media (max-width: 700px) {
      .mid-cta { margin-bottom: 64px; gap: 12px; }
      .mid-link { font-size: 0.75rem; padding: 8px 14px; white-space: normal; text-align: center; }
    }

    /* ── WHO THIS TRIP SUITS ── */
    .arch-wrap { padding: 0 48px; max-width: 1100px; margin: 0 auto 60px; }
    .arch-card {
      background: linear-gradient(135deg, rgba(45,212,191,0.09) 0%, rgba(45,212,191,0.03) 100%);
      border: 1px solid rgba(45,212,191,0.24); border-radius: 14px;
      padding: 30px 32px 28px;
    }
    .ar-head {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 0.78rem;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal);
      margin-bottom: 12px;
    }
    .ar-lead { font-size: 1.02rem; color: var(--soft); line-height: 1.7; max-width: 640px; margin-bottom: 22px; }
    .ar-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); margin-bottom: 24px; }
    .ar-card {
      background: rgba(10,22,40,0.45); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 11px; padding: 16px 18px;
    }
    .ar-card.unmatched { border-style: dashed; }
    .ar-top { display: flex; gap: 12px; align-items: flex-start; }
    .ar-badge {
      flex: none; display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--teal); color: #0a1628;
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.8rem;
      letter-spacing: 0.02em; line-height: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .ar-titles { min-width: 0; }
    .ar-name {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 0.95rem;
      color: var(--text); line-height: 1.3;
    }
    .ar-tagline {
      font-family: 'Montserrat', sans-serif; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal);
      margin-top: 5px;
    }
    .ar-why { font-size: 0.92rem; color: var(--soft); line-height: 1.55; margin-top: 12px; }
    .ar-cta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .ar-cta {
      display: inline-block; background: var(--teal); color: #0a1628;
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 0.84rem;
      letter-spacing: 0.04em; padding: 13px 26px; border-radius: 8px; text-decoration: none;
      transition: background 0.2s;
    }
    .ar-cta:hover { background: #5eead4; }
    .ar-cta:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    .ar-cta-note { font-size: 0.85rem; color: var(--muted); }
    @media (max-width: 700px) {
      .arch-wrap { padding-left: 20px; padding-right: 20px; }
      .arch-card { padding: 24px 20px; }
    }

    /* ── HOW THE TRIP WAS TRAVELLED ── */
    .transport-wrap { padding: 0 48px; max-width: 1100px; margin: 26px auto 0; }
    .transport-card {
      background: var(--s2); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 20px 24px 22px;
    }
    .tr-head {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 0.78rem;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal);
      margin-bottom: 16px;
    }
    .tr-legs { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .tr-leg { display: flex; gap: 13px; align-items: flex-start; }
    .tr-icon { font-size: 1.35rem; line-height: 1.2; flex: none; }
    .tr-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .tr-mode {
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.72rem;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--soft);
    }
    .tr-detail { font-size: 0.95rem; color: var(--text); line-height: 1.5; }
    @media (max-width: 700px) {
      .transport-wrap { padding-left: 20px; padding-right: 20px; }
      .tr-legs { grid-template-columns: 1fr; }
    }

    /* ── WILDLIFE SEEN AT A STOP ── */
    .animals { margin-top: 30px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); }
    .an-head {
      font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 0.78rem;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal);
      display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px;
    }
    .an-count { font-family: 'Lora', serif; font-style: italic; font-weight: 400; font-size: 0.82rem;
                letter-spacing: 0; text-transform: none; color: var(--muted); }
    .an-realm { margin-bottom: 20px; }
    .an-realm:last-child { margin-bottom: 0; }
    .an-realm-label {
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.68rem;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--soft);
      margin-bottom: 10px;
    }
    .an-row { display: flex; flex-wrap: wrap; gap: 12px; }
    .an-card {
      width: 132px; background: var(--s2); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
      transition: border-color 0.2s, transform 0.2s;
    }
    .an-card:hover { border-color: rgba(45,212,191,0.35); transform: translateY(-2px); }
    .an-photo { width: 100%; aspect-ratio: 1 / 1; background-size: cover; background-position: center; background-color: #16233a; }
    .an-photo.none {
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: rgba(45,212,191,0.35);
      background: linear-gradient(135deg, #0f2a2a 0%, #0d2035 100%);
    }
    .an-name {
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.78rem;
      line-height: 1.3; color: var(--text); padding: 9px 10px 0;
    }
    .an-sci {
      font-family: 'Lora', serif; font-style: italic; font-size: 0.7rem;
      color: var(--muted); padding: 2px 10px 10px; line-height: 1.3;
    }
    .an-name:last-child { padding-bottom: 10px; }
    .an-card.unmatched { border-style: dashed; }
    /* Clipped list: two rows on desktop, plus a fade so it reads as "there is more". */
    .animals.clipped .an-body {
      max-height: 400px; overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, #000 76%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 76%, transparent 100%);
    }
    .animals.clipped.open .an-body { max-height: none; -webkit-mask-image: none; mask-image: none; }
    .an-more {
      margin-top: 14px; background: none; border: 1px solid rgba(45,212,191,0.4);
      color: var(--teal); border-radius: 999px; cursor: pointer;
      font-family: 'Montserrat', sans-serif; font-size: 0.74rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 18px;
      transition: background 0.2s;
    }
    .an-more:hover { background: rgba(45,212,191,0.1); }
    .an-more:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    @media (max-width: 700px) {
      .an-card { width: calc(50% - 6px); }
      .animals.clipped .an-body { max-height: 340px; }
    }

    .section-back { display: flex; justify-content: flex-end; margin-top: 20px; }
    .back-to-map {
      background: none; border: 1px solid rgba(255,255,255,0.14);
      color: var(--soft); border-radius: 999px;
      font-family: 'Montserrat', sans-serif; font-size: 0.74rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 8px 16px; cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .back-to-map:hover { color: var(--teal); border-color: rgba(45,212,191,0.5); background: rgba(45,212,191,0.07); }
    .back-to-map:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .section.landed { animation: none; } }
    @media (max-width: 700px) {
      .map-wrap { padding-left: 20px; padding-right: 20px; }
      #trip-map { height: 320px; }
    }

    /* ── CLOSING ── */
    .closing-wrap { padding: 0 48px 120px; max-width: 1100px; margin: 0 auto; }
    .closing-block {
      background: var(--s2);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .closing-photo {
      width: 100%; aspect-ratio: 21 / 9; object-fit: cover; display: block;
      background: #1e293b;
    }
    .closing-body { padding: 48px 56px 40px; }
    .closing-headline {
      font-family: 'Montserrat', sans-serif; font-weight: 800;
      font-size: 2rem; line-height: 1.2; letter-spacing: -0.01em;
      margin-bottom: 22px; color: var(--text);
    }
    .closing-summary { font-size: 1.05rem; line-height: 1.85; color: var(--soft); }
    .closing-summary p { margin-bottom: 14px; }
    .closing-summary p:last-child { margin-bottom: 0; }
    .traveled-by-wrap { padding: 0 48px 110px; max-width: 1100px; margin: 0 auto; }
    .traveled-by-card { display: flex; gap: 30px; align-items: flex-start; background: rgba(255,255,255,0.03); border: 1px solid rgba(45,212,191,0.18); border-radius: 16px; padding: 34px 38px; }
    /* ~3in square at typical screen density. Squared off rather than a circle — at this
       size a circle crops too much of the frame to be worth it. */
    .traveled-by-photo {
      width: 288px; height: 288px; border-radius: 14px;
      object-fit: cover; flex-shrink: 0;
      border: 2px solid rgba(45,212,191,0.35);
    }
    @media (max-width: 860px) { .traveled-by-photo { width: 200px; height: 200px; } }
    .traveled-by-label { font-family: 'Montserrat', sans-serif; font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; }
    .traveled-by-names { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 1.3rem; color: var(--text); margin-bottom: 14px; }
    .traveled-by-review { font-size: 1.05rem; line-height: 1.85; color: var(--soft); font-style: italic; }
    .traveled-by-review p { margin-bottom: 12px; }
    .traveled-by-review p:last-child { margin-bottom: 0; }
    @media (max-width: 640px) { .traveled-by-wrap { padding-left: 24px; padding-right: 24px; } .traveled-by-card { flex-direction: column; align-items: center; text-align: center; } }

    /* ── CTA ── */
    .cta-wrap {
      padding: 0 48px 120px; max-width: 1100px; margin: 0 auto;
      text-align: center;
    }
    .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
    .cta-btn {
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 0.82rem;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 12px 26px; border-radius: 6px; text-decoration: none;
      transition: all 0.2s;
    }
    .cta-primary { background: var(--teal); color: #0a1628; }
    .cta-primary:hover { background: var(--teal2); }

<div id="content">
  <div class="loading-msg">Loading trip report…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Drafts are hidden unless the page itself was opened with ?preview=1, which is then
// passed through to the API. Draft pages are also kept out of search engines below.
const PREVIEW = ['1','true','yes'].includes((new URLSearchParams(location.search).get('preview')||'').toLowerCase());
const PREVIEW_Q = PREVIEW ? 'preview=1' : '';
function markDraftPage() {
  if (!PREVIEW) return;
  document.documentElement.classList.add('is-preview');
  if (!document.querySelector('meta[name="robots"]')) {
    const m = document.createElement('meta');
    m.name = 'robots'; m.content = 'noindex,nofollow';
    document.head.appendChild(m);
  }
}
markDraftPage();

// A fixed bar so there is no doubt you are looking at unpublished content.
if (PREVIEW) {
  const bar = document.createElement('div');
  bar.className = 'preview-bar';
  bar.textContent = 'Preview mode — drafts are visible and this page is hidden from search engines';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(bar));
  if (document.body) document.body.appendChild(bar);
}


const params      = new URLSearchParams(window.location.search);
const destination = (params.get('destination') || '').trim();

// Lightweight RTF → HTML: preserves paragraphs, bold (**x**), italic (*x*), links, line breaks
function rtfToHtml(text) {
  if (!text) return '';
  const escaped = String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  // Bold then italic
  let html = escaped
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Split on blank lines into paragraphs, single newlines → <br>
  const paras = html.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  return paras.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

function escapeAttr(s) { return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Serve a Cloudinary photo as a crisp, face-centered square — retina 2x of the 288px
// frame. Any non-Cloudinary URL is returned untouched.
function cldSquare(url, size) {
  if (!url) return url;
  const at = url.indexOf('/upload/');
  if (at === -1) return url;
  return url.slice(0, at + 8) + `w_${size||576},h_${size||576},c_fill,g_face,f_auto,q_auto/` + url.slice(at + 8);
}

const VIDEO_RE = /\.(mp4|webm|mov|m4v)(\?|#|$)/i;

// YouTube / Vimeo links become embedded players. Returns the embed URL plus whether the
// clip is vertical (Shorts), since those need a tall frame rather than a 16:9 one.
function embedFor(url) {
  const u = String(url || '');
  let m;
  if ((m = u.match(/(?:youtube\.com\/shorts\/)([A-Za-z0-9_-]{6,})/i)))
    return { src: `https://www.youtube-nocookie.com/embed/${m[1]}`, vertical: true };
  if ((m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?(?:.*&)?v=))([A-Za-z0-9_-]{6,})/i)))
    return { src: `https://www.youtube-nocookie.com/embed/${m[1]}`, vertical: false };
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d{6,})/i)))
    return { src: `https://player.vimeo.com/video/${m[1]}`, vertical: false };
  return null;
}

function renderPhotoGrid(photos) {
  if (!photos || !photos.length) return '';
  // Each entry is { url, caption }. Older cached responses may still send bare
  // strings, so accept both shapes.
  const figs = photos.map(p => {
    const url = typeof p === 'string' ? p : (p && p.url) || '';
    const caption = typeof p === 'string' ? '' : (p && p.caption) || '';
    if (!url) return '';

    // A hosted player has no intrinsic size to measure, so its frame is set by ratio:
    // 16:9 normally, tall for Shorts, capped to the same height as everything else.
    const embed = embedFor(url);
    if (embed) {
      return `<figure class="ph embed${embed.vertical ? ' vertical' : ''}">` +
        `<iframe src="${escapeAttr(embed.src)}" title="${escapeAttr(caption || 'Trip video')}"` +
        ` loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"` +
        ` referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>` +
        (caption ? `<figcaption>${escapeHtml(caption)}</figcaption>` : '') +
        `</figure>`;
    }

    // Both images and video are tagged portrait once their real dimensions are known,
    // so a vertical clip is held to the same height as the landscape shots around it.
    const media = VIDEO_RE.test(url)
      ? `<video src="${escapeAttr(url)}" muted loop playsinline preload="metadata" controls` +
        ` onerror="this.closest('.ph').style.display='none'"` +
        ` onloadedmetadata="if(this.videoHeight>=this.videoWidth)this.closest('.ph').classList.add('portrait')"></video>`
      : `<img src="${escapeAttr(url)}" alt="${escapeAttr(caption)}" loading="lazy"` +
        ` onerror="this.closest('.ph').style.display='none'"` +
        ` onload="if(this.naturalHeight>=this.naturalWidth)this.closest('.ph').classList.add('portrait')">`;

    return `<figure class="ph">${media}` +
      (caption ? `<figcaption>${escapeHtml(caption)}</figcaption>` : '') +
      `</figure>`;
  }).join('');
  return figs ? `<div class="photo-grid">${figs}</div>` : '';
}

// Clips play only while they're on screen — several videos in one report shouldn't all
// stream at once — and never autoplay for readers who've asked for reduced motion.
function wireVideos(root) {
  const vids = root.querySelectorAll('.photo-grid video');
  if (!vids.length) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!('IntersectionObserver' in window)) return;

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const v = e.target;
      if (e.isIntersecting) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      else if (!v.paused) v.pause();
    });
  }, { threshold: 0.4 });

  vids.forEach(v => io.observe(v));
}

// ── Trip map ──────────────────────────────────────────────────────────────
// Drawn only when at least one section carries coordinates, so reports without
// them are completely unaffected.
function renderTripMap(sections) {
  const stops = sections.filter(s => s.coords);
  if (!stops.length) return '';
  return `
    <div class="map-wrap">
      <div class="map-card">
        <div class="map-head">
          <span class="map-title">Where this trip went</span>
          <span class="map-hint">${stops.length} stop${stops.length === 1 ? '' : 's'} · tap a pin to jump to that part of the trip</span>
        </div>
        <div id="trip-map"></div>
      </div>
    </div>`;
}

// Jumping to a section is not a single scroll. The photos are lazy-loaded and declare no
// dimensions, so every image that loads on the way down adds height and pushes the target
// further away — the reader lands somewhere arbitrary. So: eagerly load the images in the
// destination section, then re-aim a few times until the position stops moving.
const SCROLL_OFFSET = 150;   // must match .section scroll-margin-top

function scrollToSection(letter) {
  const el = document.getElementById('section-' + letter);
  if (!el) return;

  // Give the destination's own photos a real height before we settle on a position.
  el.querySelectorAll('img[loading="lazy"]').forEach(img => { img.loading = 'eager'; });

  el.scrollIntoView({ behavior: 'smooth', block: 'start' });

  el.classList.remove('landed');
  void el.offsetWidth;                     // restart the flash on a repeat click
  el.classList.add('landed');

  // Correct after the smooth scroll finishes, and again as late images settle.
  [500, 1000, 1800, 2800].forEach(ms => setTimeout(() => {
    const top = el.getBoundingClientRect().top;
    if (Math.abs(top - SCROLL_OFFSET) > 8) el.scrollIntoView({ behavior: 'auto', block: 'start' });
  }, ms));
}

function initTripMap(sections) {
  const stops = sections.filter(s => s.coords);
  const el = document.getElementById('trip-map');
  if (!stops.length || !el || typeof L === 'undefined') return;

  const map = L.map(el, { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
  // Satellite imagery, then the boundaries-and-places layer on top. Esri splits these:
  // the imagery carries no labels at all, so without the reference layer the map is
  // landforms with nothing named on them.
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
  L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Imagery © Esri', maxZoom: 16
  }).addTo(map);
  L.tileLayer(ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16
  }).addTo(map);

  const pts = [];
  stops.forEach(s => {
    const { lat, lng } = s.coords;
    pts.push([lat, lng]);
    L.marker([lat, lng], {
      icon: L.divIcon({
        className: 'trip-pin-wrap',
        html: `<span class="trip-pin">${escapeHtml(s.seq || '')}</span>`,
        iconSize: [30, 30], iconAnchor: [15, 15]
      }),
      keyboard: true,
      title: s.subtitle
    })
      .addTo(map)
      .bindTooltip(`${s.seq ? s.seq + ' · ' : ''}${s.subtitle}`, { className: 'stop-tip', direction: 'top', offset: [0, -16] })
      .on('click', () => scrollToSection(s.letter));
  });

  if (pts.length === 1) map.setView(pts[0], 9);
  else map.fitBounds(L.latLngBounds(pts).pad(0.18));
}

// Viewers see a clean A, B, C… in visit order. That is deliberately NOT the Airtable
// field letter: a report can use fields A–G then I, and Section Order can reorder them,
// so field letters would show gaps or run out of sequence on the page.
function seqLabel(i) {
  return i < 26 ? String.fromCharCode(65 + i) : String(i - 25);   // A..Z then 1, 2, 3…
}

function renderSection(s, hasMap) {
  // After reading a stop the natural next move is picking another one, so send the
  // reader back to the map when there is one, and to the top of the report when there isn't.
  const backLabel = hasMap ? '↑ Back to the map' : '↑ Back to top';
  return `
    <div class="section" id="section-${escapeAttr(s.letter || '')}">
      <h2 class="section-subtitle">${s.seq ? `<span class="seq-badge">${escapeHtml(s.seq)}</span>` : ''}${(s.subtitle || '').replace(/</g,'&lt;')}</h2>
      <div class="section-body">${rtfToHtml(s.summary)}</div>
      ${renderPhotoGrid(s.photos)}
      ${renderAnimals(s.animals)}
      <div class="section-back"><button type="button" class="back-to-map">${backLabel}</button></div>
    </div>`;
}

// Deliberately understated: this interrupts the narrative, so it is a single line with
// rules either side rather than a banner competing with the photography.
function renderInlineCta(destination) {
  const label = destination ? `Plan your own ${escapeHtml(destination)} trip` : 'Plan a trip like this';
  return `
    <div class="mid-cta">
      <span class="mid-rule"></span>
      <a class="mid-link" href="lets-talk.html?ref=trip-report-mid&destination=${encodeURIComponent(destination || '')}#book">${label} →</a>
      <span class="mid-rule"></span>
    </div>`;
}

// Who this trip suits. Editorial first — it tells a reader something real about the trip —
// and it earns the assessment CTA, which is a much lighter ask than "book a call".
const ASSESSMENT_URL = 'https://app.transformedbytravels.com/transformational-profile.html?special=animals&ref=trip-report';

// Half the archetypes have no image in the table, and the ones that do are full scene
// photographs rather than icons — so the badge is a monogram, consistent for all ten and
// matching the lettered map pins.
function archetypeMonogram(name) {
  return String(name || '')
    .replace(/^the\s+/i, '')
    .split(/[\s-]+/)
    .filter(Boolean)
    .map(w => w[0])
    .join('')
    .slice(0, 2)
    .toUpperCase();
}

function renderArchetypes(list, destination) {
  if (!list || !list.length) return '';
  const cards = list.map(a => `
    <div class="ar-card${a.unmatched ? ' unmatched' : ''}">
      <div class="ar-top">
        <span class="ar-badge" aria-hidden="true">${escapeHtml(archetypeMonogram(a.name))}</span>
        <div class="ar-titles">
          <div class="ar-name">${escapeHtml(a.name)}</div>
          ${a.tagline ? `<div class="ar-tagline">${escapeHtml(a.tagline)}</div>` : ''}
        </div>
      </div>
      ${a.why ? `<div class="ar-why">${escapeHtml(a.why)}</div>` : ''}
    </div>`).join('');
  return `
    <div class="arch-wrap">
      <div class="arch-card">
        <div class="ar-head">Who this trip suits</div>
        <p class="ar-lead">Two people can take the same trip and have completely different journeys.${destination ? ` This one rewards these travellers most:` : ''}</p>
        <div class="ar-grid">${cards}</div>
        <div class="ar-cta-row">
          <a class="ar-cta" href="${ASSESSMENT_URL}${destination ? '&destination=' + encodeURIComponent(destination) : ''}" target="_blank" rel="noopener">Find your own travel style →</a>
          <span class="ar-cta-note">Free · about 5 minutes</span>
        </div>
      </div>
    </div>`;
}

// How the trip was traveled — a compact strip under the map. Deliberately brief: enough
// for a reader to picture the logistics, not an itinerary.
const TRANSPORT_ICONS = [
  [/\b(flight|fly|plane|air)\b/i,            '✈️'],
  [/\b(car|drive|driving|rental|self[- ]drive|rv|camper)\b/i, '🚗'],
  [/\b(safari|4x4|game drive|land cruiser|jeep)\b/i, '🚙'],
  [/\b(train|rail)\b/i,                      '🚆'],
  [/\b(bus|coach|shuttle|van)\b/i,           '🚌'],
  [/\b(boat|ferry|ship|cruise|zodiac|kayak|canoe)\b/i, '⛴️'],
  [/\b(helicopter|heli)\b/i,                 '🚁'],
  [/\b(foot|trek|hike|hiking|walk)\b/i,      '🥾'],
  [/\b(horse|horseback)\b/i,                 '🐎'],
  [/\b(bike|cycle|cycling)\b/i,              '🚲'],
];

function transportIcon(mode) {
  const hit = TRANSPORT_ICONS.find(([re]) => re.test(mode || ''));
  return hit ? hit[1] : '📍';
}

function renderTransport(legs) {
  if (!legs || !legs.length) return '';
  const rows = legs.map(t => `
    <div class="tr-leg">
      <span class="tr-icon" aria-hidden="true">${transportIcon(t.mode)}</span>
      <div class="tr-text">
        ${t.mode ? `<span class="tr-mode">${escapeHtml(t.mode)}</span>` : ''}
        ${t.detail ? `<span class="tr-detail">${escapeHtml(t.detail)}</span>` : ''}
      </div>
    </div>`).join('');
  return `
    <div class="transport-wrap">
      <div class="transport-card">
        <div class="tr-head">Getting there &amp; getting around</div>
        <div class="tr-legs">${rows}</div>
      </div>
    </div>`;
}

// Animals seen at a stop, grouped into the three realms. A name with no match in the
// species table still shows — as a plain chip — so nothing silently disappears.
const REALM_ICON = { Land: '🌍', Ocean: '🌊', Sky: '🕊️', Other: '•' };

// Past this many species in one stop the list is clipped behind a "show more", so a
// big sighting list does not bury the rest of the report — especially on a phone, where
// the cards drop to two per row.
const ANIMALS_SHOWN = 8;

function renderAnimals(groups) {
  if (!groups || !groups.length) return '';
  const total = groups.reduce((n, g) => n + g.animals.length, 0);
  if (!total) return '';
  const clipped = total > ANIMALS_SHOWN;

  const blocks = groups.map(g => {
    const cards = g.animals.map(a => {
      const photo = a.photo
        ? `<div class="an-photo" style="background-image:url('${escapeAttr(a.photo).replace(/'/g, '%27')}');"></div>`
        : `<div class="an-photo none">${REALM_ICON[g.realm] || '•'}</div>`;
      return `<div class="an-card${a.unmatched ? ' unmatched' : ''}">
          ${photo}
          <div class="an-name">${escapeHtml(a.name)}</div>
          ${a.scientific ? `<div class="an-sci">${escapeHtml(a.scientific)}</div>` : ''}
        </div>`;
    }).join('');
    return `<div class="an-realm">
        <div class="an-realm-label">${REALM_ICON[g.realm] || ''} ${escapeHtml(g.realm)}</div>
        <div class="an-row">${cards}</div>
      </div>`;
  }).join('');

  return `<div class="animals${clipped ? ' clipped' : ''}">
      <div class="an-head">Wildlife seen here <span class="an-count">${total} species</span></div>
      <div class="an-body">${blocks}</div>
      ${clipped ? `<button type="button" class="an-more" data-total="${total}">Show all ${total} species</button>` : ''}
    </div>`;
}

function scrollToMap() {
  const map = document.getElementById('trip-map');
  if (map) {
    const card = map.closest('.map-wrap') || map;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

async function init() {
  const root = document.getElementById('content');

  if (!destination) {
    root.innerHTML = `<div class="error-msg">No trip report specified. <a href="trip-reports.html" style="color:var(--teal);">See all reports</a>.</div>`;
    return;
  }

  let report = null;
  try {
    const resp = await fetch(`/api/trip-reports?destination=${encodeURIComponent(destination)}${PREVIEW_Q ? '&' + PREVIEW_Q : ''}`);
    const data = await resp.json();
    report = data.report;
  } catch(e) {
    root.innerHTML = `<div class="error-msg">Could not load this trip report.</div>`;
    return;
  }

  if (!report) {
    root.innerHTML = `<div class="error-msg">Trip report not found. <a href="trip-reports.html" style="color:var(--teal);">See all reports</a>.</div>`;
    return;
  }

  document.title = `${report.title || report.destination} — Trip Report — Three Realms Travel`;
  document.getElementById('page-title').textContent = document.title;

  const heroBg = report.heroPhoto
    ? `<div class="hero-bg-img" style="background-image:url('${escapeAttr(report.heroPhoto)}');"></div>`
    : '';

  // Stamp the visit-order label once, so the map pin and the heading always agree.
  (report.sections || []).forEach((s, i) => { s.seq = seqLabel(i); });
  const hasMap = (report.sections || []).some(s => s.coords);

  // A quiet prompt every few stops — a long report otherwise offers nothing to act on
  // between the hero and the very end. Never directly before the closing CTA.
  const CTA_EVERY = 4;
  const secs = report.sections || [];
  const sectionsHtml = secs.map((s, i) => {
    const html = renderSection(s, hasMap);
    const isBreak = (i + 1) % CTA_EVERY === 0 && (i + 1) < secs.length;
    return isBreak ? html + renderInlineCta(report.destination) : html;
  }).join('');

  const closingHtml = (report.closingHeadline || report.closingPhoto || report.closingSummary) ? `
    <div class="closing-wrap">
      <div class="closing-block">
        <div class="closing-body">
          ${report.closingHeadline ? `<h2 class="closing-headline">${report.closingHeadline.replace(/</g,'&lt;')}</h2>` : ''}
          <div class="closing-summary">${rtfToHtml(report.closingSummary)}</div>
        </div>
        ${report.closingPhoto ? `<img class="closing-photo" src="${escapeAttr(report.closingPhoto)}" alt="" onerror="this.style.display='none'">` : ''}
      </div>
    </div>` : '';

  const traveledByHtml = (report.travelers || report.travelersReview || report.travelersPhoto) ? `
    <div class="traveled-by-wrap">
      <div class="traveled-by-card">
        ${report.travelersPhoto ? `<img class="traveled-by-photo" src="${escapeAttr(cldSquare(report.travelersPhoto))}" alt="${(report.travelers || '').replace(/"/g,'&quot;')}" onerror="this.style.display='none'">` : ''}
        <div class="traveled-by-body">
          <div class="traveled-by-label">Traveled by</div>
          ${report.travelers ? `<div class="traveled-by-names">${report.travelers.replace(/</g,'&lt;')}</div>` : ''}
          ${report.travelersReview ? `<div class="traveled-by-review">${rtfToHtml(report.travelersReview)}</div>` : ''}
        </div>
      </div>
    </div>` : '';

  root.innerHTML = `
    <div class="hero">
      <div class="hero-bg"></div>
      ${heroBg}
      <div class="hero-scrim"></div>
      <div class="hero-content">
        <a class="back-link" href="trip-reports.html">← All trip reports</a>
        <div class="destination-tag">${(report.destination || '').replace(/</g,'&lt;')}</div>
        <h1 class="hero-title">${(report.title || '').replace(/</g,'&lt;')}</h1>
        <div class="trip-summary">${rtfToHtml(report.tripSummary)}</div>
        <a class="hero-cta" href="lets-talk.html?ref=trip-report-top&destination=${encodeURIComponent(report.destination || '')}#book">
          ${report.destination ? `Plan your own ${escapeHtml(report.destination)} trip` : 'Plan a trip like this'} →
        </a>
      </div>
    </div>

    ${renderTripMap(report.sections || [])}

    ${renderTransport(report.transport)}

    <div class="sections-wrap">${sectionsHtml}</div>

    ${closingHtml}

    ${traveledByHtml}

    ${renderArchetypes(report.archetypes, report.destination)}

    <div class="cta-wrap">
      <div class="cta-row">
        <a class="cta-btn cta-primary" href="lets-talk.html?ref=trip-report&destination=${encodeURIComponent(report.destination || '')}#book">${report.destination ? `Plan your own ${escapeHtml(report.destination)} trip` : 'Plan a trip like this'}</a>
        <a class="cta-btn cta-secondary" href="trip-reports.html">Read another report</a>
      </div>
    </div>
  `;

  // A cached photo can finish loading before its onload handler runs, so catch those here.
  root.querySelectorAll('.photo-grid img').forEach(img => {
    if (img.complete && img.naturalHeight >= img.naturalWidth) {
      const fig = img.closest('.ph');
      if (fig) fig.classList.add('portrait');
    }
  });

  // Cached video can report its dimensions before the inline handler is wired, same as photos.
  root.querySelectorAll('.photo-grid video').forEach(v => {
    if (v.readyState >= 1 && v.videoHeight >= v.videoWidth) {
      const fig = v.closest('.ph');
      if (fig) fig.classList.add('portrait');
    }
  });

  root.querySelectorAll('.back-to-map').forEach(b => { b.onclick = scrollToMap; });

  root.querySelectorAll('.an-more').forEach(btn => {
    btn.onclick = () => {
      const box = btn.closest('.animals');
      const open = box.classList.toggle('open');
      btn.textContent = open ? 'Show fewer' : `Show all ${btn.dataset.total} species`;
    };
  });

  wireVideos(root);
  initTripMap(report.sections || []);
}
init();
</script>

</body>
</html>
